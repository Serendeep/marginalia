org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# WARNING: connected tests uninstall the app afterwards (UTP sets
# uninstall_after_test regardless of this flag on AGP 8.9 — verified from
# utp.0.log after a data wipe). Uninstall deletes all app data, so NEVER run
# connectedDebugAndroidTest against a personal device with real notes; use
# the emulator (spike35). Real devices only get installDebug.
android.experimental.androidTest.leaveApksInstalledAfterTest=true
