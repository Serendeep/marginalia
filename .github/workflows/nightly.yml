name: Nightly

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release-signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_STORE_PASSWORD"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build nightly APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          APP_VERSION=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$APP_VERSION"
          VERSION_NAME="$APP_VERSION-nightly.$COUNT+$SHORT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew assembleRelease \
            -PversionCodeOverride=$((COUNT * 10)) -Pchannel=nightly -PversionNameOverride="$VERSION_NAME" --stacktrace

      - name: Publish to the nightly pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TAG=nightly
          SHA_COMMIT=$(git rev-parse HEAD)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          VERSION_CODE=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$VERSION_CODE"
          echo "$SHA  app-release.apk" > app-release.apk.sha256

          LAST_STABLE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            if [ -n "$LAST_STABLE" ]; then
              printf 'Nightly build %s — commits since %s:\n\n' "$VERSION_NAME" "$LAST_STABLE"
              git log -n 50 --format='- %s' "$LAST_STABLE..HEAD"
            else
              printf 'Nightly build %s — recent commits:\n\n' "$VERSION_NAME"
              git log --format='- %s' -50
            fi
          } > notes.md

          # The same commits, grouped for the in-app notes: feat is New, fix is Fixed, the rest Improved.
          git log -n 50 --format='%s' ${LAST_STABLE:+"$LAST_STABLE..HEAD"} \
            | { grep -Ev '^(Merge pull request|(chore|ci|docs|test|build)(\([^)]*\))?!?:)' || true; } \
            | awk '
              /^$/ { next }
              { t = "Improved"; s = $0
                if (match($0, /^[a-z]+(\([^)]*\))?!?: /)) {
                  ty = $0; sub(/[(!:].*/, "", ty); s = substr($0, RLENGTH + 1)
                  if (ty == "feat") t = "New"; else if (ty == "fix") t = "Fixed"
                }
                items[t] = items[t] "- " s "\n" }
              END { split("New Fixed Improved", o, " ")
                for (i = 1; i <= 3; i++) if (items[o[i]] != "") printf "### %s\n\n%s\n", o[i], items[o[i]] }' > feed-notes.md

          git tag -f "$TAG" "$SHA_COMMIT"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --target "$SHA_COMMIT" --title "Nightly" --notes-file notes.md
          else
            gh release create "$TAG" --prerelease --latest=false --verify-tag --title "Nightly" --notes-file notes.md
          fi

          echo '[]' > patches.json
          PATCH=""
          make_patch() {
            command -v zstd >/dev/null || sudo apt-get install -y zstd || return 1
            mkdir -p patch-work
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx app-release.apk || return 0
            gh release download "$TAG" -p app-release.apk -D patch-work --clobber || return 1
            gh release download "$TAG" -p latest.json -D patch-work --clobber 2>/dev/null || true
            OLD_CODE=$(jq -r '.versionCode // empty' patch-work/latest.json 2>/dev/null || true)
            [ -n "$OLD_CODE" ] || OLD_CODE=$("$BT/aapt2" dump badging patch-work/app-release.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            [ -n "$OLD_CODE" ] || return 1
            [ "$OLD_CODE" != "$VERSION_CODE" ] || return 0
            P="app-release-from-$OLD_CODE.zst"
            zstd -19 --long=27 --patch-from=patch-work/app-release.apk "$APK" -o "$P" -f -q || return 1
            zstd -d --long=27 --patch-from=patch-work/app-release.apk "$P" -o patch-work/check.apk -f -q || { rm -f "$P"; return 1; }
            cmp patch-work/check.apk "$APK" || { rm -f "$P"; return 1; }
            jq -n --argjson from "$OLD_CODE" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$P" \
              --arg sha256 "$(sha256sum "$P" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$P")" \
              '[{fromVersionCode: $from, url: $url, sha256: $sha256, size: $size}]' > patches.json
            PATCH="$P"
          }
          make_patch || echo "::warning::Delta patch generation failed; publishing the full APK only"

          jq -n \
            --slurpfile patches patches.json \
            --rawfile notes feed-notes.md \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk" \
            --arg sha256 "$SHA" \
            --argjson size "$(stat -c %s "$APK")" \
            --arg certSha256 "$CERT" \
            --arg notesUrl "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel: "nightly", versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, size: $size, certSha256: $certSha256, notesUrl: $notesUrl, publishedAt: $publishedAt, patches: $patches[0], notes: ($notes | sub("^\\s+"; "") | sub("\\s+$"; ""))}' > latest.json
          cp config/remote-config.json remote-config.json

          # latest.json goes last: until it lands, clients keep seeing the previous build.
          if [ -n "$PATCH" ] && ! gh release upload "$TAG" "$PATCH" --clobber; then
            echo "::warning::Patch upload failed; publishing the full APK only"
            echo '[]' > patches.json
            PATCH=""
            jq '.patches = []' latest.json > latest.next && mv latest.next latest.json
          fi
          gh release upload "$TAG" "$APK" app-release.apk.sha256 remote-config.json --clobber
          gh release upload "$TAG" latest.json --clobber

          # Drop patches left from earlier builds; they no longer match what is installed.
          for stale in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep '^app-release-from-.*\.zst$' || true); do
            [ "$stale" = "$PATCH" ] || gh release delete-asset "$TAG" "$stale" -y || true
          done
