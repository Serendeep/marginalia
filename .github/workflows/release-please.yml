name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release PR or release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify release-signing configuration
        if: ${{ steps.release.outputs.release_created }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_STORE_PASSWORD"

      - name: Check out released source
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: ${{ steps.release.outputs.release_created }}
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: ${{ steps.release.outputs.release_created }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Verify, build, and publish APK
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          ./gradlew testDebugUnitTest lintDebug publishReleaseApkPublicationToGitHubPackagesRepository \
            -PversionCodeOverride=$((COUNT * 10 + 5)) -Pchannel=stable --stacktrace

      - name: Attach APK to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "$SHA  app-release.apk" > app-release.apk.sha256
          gh release upload "${{ steps.release.outputs.tag_name }}" "$APK" app-release.apk.sha256 --clobber
          TAG="${{ steps.release.outputs.tag_name }}"
          VERSION_CODE=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$VERSION_CODE"
          echo '[]' > patches.json
          make_patches() {
            command -v zstd >/dev/null || sudo apt-get install -y zstd || return 1
            mkdir -p patch-work
            made=0
            for prev in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName -q '.[].tagName'); do
              [ "$made" -ge 2 ] && break
              [ "$prev" = "$TAG" ] && continue
              gh release view "$prev" --json assets -q '.assets[].name' | grep -qx app-release.apk || continue
              dir="patch-work/$prev"
              mkdir -p "$dir"
              gh release download "$prev" -p app-release.apk -D "$dir" || continue
              gh release download "$prev" -p latest.json -D "$dir" 2>/dev/null || true
              OLD_CODE=$(jq -r '.versionCode // empty' "$dir/latest.json" 2>/dev/null || true)
              [ -n "$OLD_CODE" ] || OLD_CODE=$("$BT/aapt2" dump badging "$dir/app-release.apk" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
              [ -n "$OLD_CODE" ] || continue
              PATCH="app-release-from-$OLD_CODE.zst"
              zstd -19 --long=27 --patch-from="$dir/app-release.apk" "$APK" -o "$PATCH" -f -q || continue
              zstd -d --long=27 --patch-from="$dir/app-release.apk" "$PATCH" -o "$dir/check.apk" -f -q || { rm -f "$PATCH"; continue; }
              cmp "$dir/check.apk" "$APK" || { rm -f "$PATCH"; continue; }
              gh release upload "$TAG" "$PATCH" --clobber || { rm -f "$PATCH"; continue; }
              jq --argjson from "$OLD_CODE" \
                --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$PATCH" \
                --arg sha256 "$(sha256sum "$PATCH" | cut -d' ' -f1)" \
                --argjson size "$(stat -c %s "$PATCH")" \
                '. + [{fromVersionCode: $from, url: $url, sha256: $sha256, size: $size}]' patches.json > patches.next && mv patches.next patches.json
              made=$((made + 1))
            done
          }
          make_patches || echo "::warning::Delta patch generation failed; publishing the full APK only"
          awk -v v="${TAG#v}" 'index($0,"## ["v"]")==1||index($0,"## "v" ")==1{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > release-notes.md
          jq -n \
            --slurpfile patches patches.json \
            --rawfile notes release-notes.md \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "${TAG#v}" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk" \
            --arg sha256 "$SHA" \
            --argjson size "$(stat -c %s "$APK")" \
            --arg certSha256 "$CERT" \
            --arg notesUrl "${{ steps.release.outputs.html_url }}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel: "stable", versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, size: $size, certSha256: $certSha256, notesUrl: $notesUrl, publishedAt: $publishedAt, patches: $patches[0], notes: ($notes | sub("^\\s+"; "") | sub("\\s+$"; ""))}' > latest.json
          cp config/remote-config.json remote-config.json
          gh release upload "$TAG" latest.json remote-config.json --clobber
          gh release view "${{ steps.release.outputs.tag_name }}" --json body -q .body > notes.md
          printf '\n\n### Verify this download\n\n- APK SHA-256: `%s`\n- Signing certificate SHA-256: `%s`\n\n`sha256sum app-release.apk` and `apksigner verify --print-certs app-release.apk` should print the same values.\n' "$SHA" "$CERT" >> notes.md
          gh release edit "${{ steps.release.outputs.tag_name }}" --notes-file notes.md
